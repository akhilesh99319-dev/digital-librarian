<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Digital Librarian</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">📚</div>
      <h2>DIGITAL LIBRARIAN</h2>
      <p>Librarian Portal &bull; Management System</p>
    </div>

    <div id="errorAlert" style="display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;text-align:center;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email" class="form-label">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="akhilesh@library.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="req">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:10px;padding:12px;">
        Sign In to Digital Librarian
      </button>
    </form>

    <div class="dev-credentials-box">
      <div style="font-weight:700;color:#fff;margin-bottom:4px;">🔑 Development Login Credentials:</div>
      <div>Email: <strong>akhilesh@library.com</strong></div>
      <div>Password: <strong>Password@123</strong></div>
      <div>Role: <strong>Librarian</strong></div>
      <button type="button" id="quickFillBtn" class="btn btn-sm btn-secondary" style="width:100%;margin-top:10px;font-size:11.5px;">
        ⚡ Auto-fill Credentials
      </button>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
