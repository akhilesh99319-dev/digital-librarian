<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Digital Librarian</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">📚</div>
      <h2>DIGITAL LIBRARIAN</h2>
      <p id="portalSubtitle">Library Management System &bull; Portal Access</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="login-tabs">
      <button type="button" class="login-tab-btn active" id="tabLoginBtn" data-tab="login">Sign In</button>
      <button type="button" class="login-tab-btn" id="tabRegisterBtn" data-tab="register">Create Account</button>
    </div>

    <!-- Alert Messages -->
    <div id="errorAlert" style="display:none;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;text-align:center;"></div>
    <div id="successAlert" style="display:none;background:rgba(16,185,129,0.15);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;text-align:center;"></div>

    <!-- Sign In Form View -->
    <div id="loginSection">
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address or Member Code <span class="req">*</span></label>
          <input type="text" id="email" class="form-control" placeholder="Enter email or member code" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="req">*</span></label>
          <div class="password-input-group" style="position:relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" style="padding-right:42px;">
            <button type="button" class="pw-toggle-btn" id="loginPwToggle" aria-label="Toggle password visibility" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px;padding:4px;">👁️</button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:10px;padding:12px;font-weight:600;">
          Sign In to Digital Librarian
        </button>
      </form>

      <div style="text-align:center;margin-top:18px;font-size:13px;color:#94a3b8;">
        Don't have an account? 
        <a href="#" id="linkToRegister" style="color:#818cf8;font-weight:600;text-decoration:none;">Create Account</a>
      </div>
    </div>

    <!-- Create Account / Registration Form View -->
    <div id="registerSection" style="display:none;">
      <form id="registerForm">
        <div class="form-group">
          <label for="regName" class="form-label">Full Name <span class="req">*</span></label>
          <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address <span class="req">*</span></label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="regPhone" class="form-label">Phone Number</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="+91 98765 43210" autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password <span class="req">*</span></label>
          <div class="password-input-group" style="position:relative;">
            <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password" style="padding-right:42px;">
            <button type="button" class="pw-toggle-btn" id="regPwToggle" aria-label="Toggle password visibility" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px;padding:4px;">👁️</button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password <span class="req">*</span></label>
          <div class="password-input-group" style="position:relative;">
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password" style="padding-right:42px;">
            <button type="button" class="pw-toggle-btn" id="regConfirmPwToggle" aria-label="Toggle confirm password visibility" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:15px;padding:4px;">👁️</button>
          </div>
        </div>

        <button type="submit" id="registerBtn" class="btn btn-primary" style="width:100%;margin-top:10px;padding:12px;font-weight:600;">
          Create Member Account
        </button>
      </form>

      <div style="text-align:center;margin-top:18px;font-size:13px;color:#94a3b8;">
        Already have an account? 
        <a href="#" id="linkToLogin" style="color:#818cf8;font-weight:600;text-decoration:none;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
