<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Library Management System</title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="./assets/css/style.css"
    >

    <!-- Responsive CSS -->
    <link
        rel="stylesheet"
        href="./assets/css/responsive.css"
    >

    <!-- Animation CSS -->
    <link
        rel="stylesheet"
        href="./assets/css/animation.css"
    >

    <!-- Forgot Password CSS -->
    <link
        rel="stylesheet"
        href="./assets/css/forgot-password.css"
    >

</head>


<body class="forgot-password-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="forgot-header">

        <nav class="forgot-navbar">

            <a
                href="./index.html"
                class="forgot-logo"
            >

                <span>
                    📚
                </span>

                <strong>
                    Library Management System
                </strong>

            </a>


            <a
                href="./login.html"
                class="back-login"
            >
                ← Back to Login
            </a>

        </nav>

    </header>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="forgot-main">

        <section class="forgot-card">


            <!-- =================================
                 ICON
            ================================== -->

            <div class="forgot-icon">
                🔐
            </div>


            <!-- =================================
                 HEADER
            ================================== -->

            <div class="forgot-card-header">

                <span class="forgot-badge">
                    🔑 ACCOUNT RECOVERY
                </span>


                <h1>
                    Forgot Your Password?
                </h1>


                <p>
                    Enter your registered email address
                    and we'll help you recover your account.
                </p>

            </div>



            <!-- =================================
                 FORM
            ================================== -->

            <form
                id="forgotPasswordForm"
                class="forgot-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="forgotEmail">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉️
                        </span>


                        <input
                            type="email"
                            id="forgotEmail"
                            name="email"
                            placeholder="Enter your registered email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- MESSAGE -->

                <div
                    id="forgotMessage"
                    class="forgot-message"
                    aria-live="polite"
                ></div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="forgot-submit"
                >

                    <span>
                        Continue
                    </span>

                    <span>
                        →
                    </span>

                </button>


            </form>



            <!-- =================================
                 LOGIN LINK
            ================================== -->

            <div class="forgot-login-link">

                Remember your password?

                <a href="./login.html">
                    Login
                </a>

            </div>



            <!-- =================================
                 BACK HOME
            ================================== -->

            <a
                href="./index.html"
                class="forgot-home-link"
            >
                ← Back to Home
            </a>


        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="forgot-footer">

        <p>
            © 2026 Library Management System.
            All Rights Reserved.
        </p>

    </footer>



    <!-- Forgot Password JavaScript -->

    <script
        src="./assets/js/forgot-password.js"
    ></script>

</body>

</html>
